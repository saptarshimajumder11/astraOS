            /*astraOS-corestyle*/
            * {
                box-sizing: border-box;
                user-select: none;
            }
            html,

                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;

            }
            body{
                background:

                radial-gradient(circle at 80% 80%,#421d62,transparent 35%),
                #070914;

                background-size:cover;
                background-position:center;
                background-repeat:no-repeat;
            }
            /*DESKTOP*/
            #desktop{
                position:relative;
                width:100%;
                height:100vh;
                overflow:hidden;
                background:radial-gradient(
                    ellipse at 50% 50%,
                rgba(150,60,220,0.35),
                transparent 25%
                ),

                radial-gradient(
                     ellipse at 35% 45%,
                     rgba(40,100,255,0.30),
                    transparent 35%
                ), 
                radial-gradient(
                    ellipse at 70% 55%,
                    rgba(220,50,180,0.25),
                ),
                linear-gradient(
                    135deg,
                    #03030b,
                    #080b1f,
                    #020208
                );

            }
            #desktop::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 45%;

    left: -25%;
    top: 30%;

    background: radial-gradient(
        ellipse,
        transparent 25%,
        rgba(150, 60, 255, 0.35) 45%,
        transparent 70%
    );

    transform: rotate(-18deg);
    filter: blur(35px);
    pointer-events: none;
}
#desktop::after {
    content: "";
    position: absolute;
    width: 130%;
    height: 35%;

    left: -15%;
    top: 38%;

    background: radial-gradient(
        ellipse,
        transparent 30%,
        rgba(40, 100, 255, 0.3) 48%,
        transparent 70%
    );

    transform: rotate(18deg);
    filter: blur(40px);
    pointer-events: none;
}
            /*STAR EFFECT*/
            .stars{
                position:absolute;
                inset:0;
                background-image:
                radial-gradient(white 1px,transparent 1px),
                radial-gradient(white 1px,transparent 1px);

                background-size: 70px 70px, 120px 120px;
                background-position: 0 0, 40px 60px;
                opacity:0.35;
                pointer-events: none;

       function setupCalculator(win) {

    const display =
        win.querySelector("#calc-display");

    const buttons =
        win.querySelectorAll(".calculator-grid button");

    let firstNumber = null;
    let operator = null;
    let waitingForSecond = false;

    function calculate(a, b, op) {

        if (op === "+") return a + b;
        if (op === "-") return a - b;
        if (op === "*") return a * b;

        if (op === "/") {
            if (b === 0) return "Error";
            return a / b;
        }

        if (op === "%") return a % b;
    }

    function inputNumber(value) {

        if (display.textContent === "Error") {
            display.textContent = "0";
        }

        if (waitingForSecond) {
            display.textContent =
                value === "." ? "0." : value;

            waitingForSecond = false;
            return;
        }

        if (
            value === "." &&
            display.textContent.includes(".")
        ) {
            return;
        }

        if (
            display.textContent === "0" &&
            value !== "."
        ) {
            display.textContent = value;
        } else {
            display.textContent += value;
        }
    }

    function chooseOperator(op) {

        firstNumber =
            Number(display.textContent);

        operator = op;
        waitingForSecond = true;
    }

    function equals() {

        if (
            firstNumber === null ||
            operator === null
        ) {
            return;
        }

        const secondNumber =
            Number(display.textContent);

        const result =
            calculate(
                firstNumber,
                secondNumber,
                operator
            );

        display.textContent =
            String(result);

        firstNumber = null;
        operator = null;
        waitingForSecond = true;
    }

    buttons.forEach(button => {

        button.addEventListener("click", () => {

            const value =
                button.dataset.value;

            const action =
                button.dataset.action;

            if (value !== undefined) {

                if (
                    ["+", "-", "*", "/", "%"]
                    .includes(value)
                ) {
                    chooseOperator(value);
                } else {
                    inputNumber(value);
                }

            }

            if (action === "clear") {
                display.textContent = "0";
                firstNumber = null;
                operator = null;
                waitingForSecond = false;
            }

            if (action === "delete") {

                if (
                    display.textContent.length > 1
                ) {
                    display.textContent =
                        display.textContent.slice(0, -1);
                } else {
                    display.textContent = "0";
                }

            }

            if (action === "equals") {
                equals();
            }

        });

    });
}

        function createWindow(appName) {

            const win =
                document.createElement("div");


            win.className = "window";


            win.dataset.app =

            win.style.left =

            win.style.top =

                        ${appName}

                    </div>


                    <div class="controls">

                        <div

                        </div>


                        <div
                            class="control close">
                        </div>

                    </div>

                </div>


                <div class="window-content">

                    ${apps[appName]}

                </div>

            `;

                .getElementById("desktop")

            win.addEventListener(

                    }
                );

                                "false";

                        }

                        else {

                            win.style.width =
                                "100%";

                            win.style.height =

                            win.dataset.maximized =

                    }

            makeDraggable(win);
if (appName === "Calculator") {

}

        function makeDraggable(win) {

            const bar =
                win.querySelector(
                    ".titlebar"
                );


            let dragging = false;

            let offsetX = 0;

            let offsetY = 0;


            bar.addEventListener(
                "mousedown",
                e => {

                    dragging = true;


                    offsetX =
                        e.clientX -
                        win.offsetLeft;


                    offsetY =
                        e.clientY -
                        win.offsetTop;


                    win.style.zIndex =
                        ++zIndex;

                }
            );


            document.addEventListener(
                "mousemove",
                e => {

                    if (!dragging) {
                        return;
                    }


                    win.style.left =
                        (
                            e.clientX -
                            offsetX
                        ) + "px";


                    win.style.top =
                        (
                            e.clientY -
                            offsetY
                        ) + "px";

                }
            );


            document.addEventListener(
                "mouseup",
                () => {

                    dragging = false;

                }
            );

        }
        function updateTaskbarClock() {

            let minutes = now.getMinutes();
            hours = String(hours).padStart(2,"0");
            minutes = String(minutes).padStart(2,"0");
            document.getElementById("taskbar-clock").textContent = `${hours}:${minutes}`;
        }

   function setupCalculator(win) {

    const display =
        win.querySelector("#calc-display");

    const buttons =
        win.querySelectorAll(".calculator-grid button");

    let firstNumber = null;
    let operator = null;
    let waitingForSecond = false;

    function calculate(a, b, op) {

        if (op === "+") return a + b;
        if (op === "-") return a - b;
        if (op === "*") return a * b;

        if (op === "/") {
            if (b === 0) return "Error";
            return a / b;
        }

        if (op === "%") return a % b;
    }

    function inputNumber(value) {

        if (display.textContent === "Error") {
            display.textContent = "0";
        }

        if (waitingForSecond) {
            display.textContent =
                value === "."
                ? "0."
                : value;

            waitingForSecond = false;
            return;
        }

        if (
            value === "." &&
            display.textContent.includes(".")
        ) {
            return;
        }

        if (
            display.textContent === "0" &&
            value !== "."
        ) {
            display.textContent = value;
        } else {
            display.textContent += value;
        }
    }

    function chooseOperator(op) {

        firstNumber =
            Number(display.textContent);

        operator = op;
        waitingForSecond = true;
    }

    function equals() {

        if (
            firstNumber === null ||
            operator === null
        ) {
            return;
        }

        const secondNumber =
            Number(display.textContent);

        const result =
            calculate(
                firstNumber,
                secondNumber,
                operator
            );

        display.textContent =
            String(result);

        firstNumber = null;
        operator = null;
        waitingForSecond = true;
    }

    buttons.forEach(button => {

        button.addEventListener("click", () => {

            const value =
                button.dataset.value;

            const action =
                button.dataset.action;

            if (value !== undefined) {
                if (
                    ["+", "-", "*", "/", "%"]
                    .includes(value)
                ) {
                    chooseOperator(value);
                } else {
                    inputNumber(value);
                }
            }

            if (action === "clear") {
                display.textContent = "0";
                firstNumber = null;
                operator = null;
                waitingForSecond = false;
            }

            if (action === "delete") {

                if (
                    display.textContent.length > 1
                ) {
                    display.textContent =
                        display.textContent.slice(0, -1);
                } else {
                    display.textContent = "0";
                }
            }

            if (action === "equals") {
                equals();
            }

        });

    });
}
