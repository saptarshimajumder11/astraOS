<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>astraOS</title>
        
          <link rel="stylesheet" href="style.css">
         
    </head>
    <body>

    <div id="desktop">
       <div id="taskbar">

    <div class="taskbar-left">

        <button
            class="start-button">
            <img src="astra-logo.png"
            alt="ASTRA">
        </button>

        <button
            class="taskbar-app"
            id="files-button"
            title="Files"
        >
            <img src="svg/files.svg" alt="Files">
        </button>

        <button
            class="taskbar-app"
            id="notes-button"
            title="Notes"
        >
            <img src="svg/notes.svg" alt="Notes">
        </button>

        <button
            class="taskbar-app"
            id="calculator-button"
            title="Calculator"
        >
            <img src="svg/calculator.svg" alt="Calculator">
        </button>

        <button
            class="taskbar-app"
            id="settings-button"
            title="Settings"
        >
        
            <img src="svg/settings.svg" alt="settings">
        </button>
        

    </div>
     <button class="taskbar-app"
        id="widgets-button" title="widgets">
        <img src="svg/widgets.svg" alt="widgets">
    </button>

    <div id="start-menu">
        <div class="start-title">
            <img src="astra-nameplate.png" alt="astraOS">
        </div>
        <button id="start-files">
            <img src="svg/files.svg" alt="files"></button>
        <button  id="start-notes">
            <img src="svg/notes.svg" alt="notes">
        </button>
        <button id="start-calculator">
            <img src="svg/calculator.svg" alt="calculator">
        
        </button>
        <button id="start-settings">
            <img src="svg/settings.svg" alt="settings">
        </button>
        <button id="start-calendar">
            <img src="svg/calendar.svg" alt="calendar">
        </button>
    </div>

   

</div>

      
        <!-- TOP BAR -->

        <div id="top-bar">

            <div class="logo">
                <img src="astra-nameplate.png"
                alt="astraOS">
            </div>

          
        

        <div class="system-status">
            <img src="svg/wifi-icon.svg" alt="wi-fi">
            <img src="svg/battery-icon.svg" alt="Battery">
            <div id="date-time">
                <div id="date">15 sep 2026</div>
                <div id="time"><b>10:07 pm</b></div>
            </div>
        </div>
        </div>

        
 
    <div id="widget-panel">
    <div class="widget-header">
        <h2>Widgets</h2>

        <button id="widget-close">
            <img src="svg/close.svg" alt="close">
        </button>
    </div>
</div>
<script src="script.js"></script>
</body>

</html>
